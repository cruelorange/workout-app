[{"id":"cb7d68c1-b445-4d92-886e-8218242d9101","name":"Эксцентрические отжимания с ног, подъем с колен","order":"1. Исходное положение: планка с упором на ладони.\n2. Медленно на 6 счетов опускаемся вниз, грудью, животом и бедрами касаемся пола.\n3. Из положения лежа подняться с упором на колени на выпрямленные руки. Принять исходное положение.","tech":"1. Ладони стоят параллельно друг другу под плечевыми суставами и чуть шире их. Голова, туловище, ноги находятся в одной линии на протяжении всего движения. Кор напряжен, поясница не прогибается, таз не уходит вверх, колени выпрямлены, носки упираются в пол. \n2. С началом движения вниз лопатки приведены, плечи не поднимаются. По мере движения плечо не проворачивается во внутрь, локоть не уходит наружу. В нижней точке плечо отведено от корпуса на 45-60 градусов.\n3. Из положения лежа подняться в упор на колени, контролируя положение лопаток, кора и таза.","video":"https://www.youtube.com/watch?v=OEtAxzwjHiU","photo":"","muscles":"","equipment":"","links":"https://ru.imgbb.com/\nhttps://postimages.org/ru/"}]

